<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 136" width="116" height="136" fill="none">
  <defs>
    <filter id="badgeShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242b35" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>
  </defs>

  <!-- Shield Body -->
  <path d="M 12 5 H 104 A 8 8 0 0 1 112 13 V 92 L 58 126 L 4 92 V 13 A 8 8 0 0 1 12 5 Z" 
        fill="#ffffff" stroke="#e8ebf0" stroke-width="1.2" filter="url(#badgeShadow)" />

  <!-- Dribbble Ball Icon -->
  <g transform="translate(58, 20)">
    <circle cx="0" cy="0" r="7.8" stroke="#18181b" stroke-width="1.3" fill="none" />
    <path d="M -5.4 -5.4 C -0.8 -2.8 3.5 -3.8 6.6 -3" stroke="#18181b" stroke-width="1.1" fill="none" stroke-linecap="round" />
    <path d="M -7.3 2 C -1.8 1 3 4 6.3 3.8" stroke="#18181b" stroke-width="1.1" fill="none" stroke-linecap="round" />
    <path d="M -1.8 -7.3 C 1.2 -1.8 1.4 3 0.2 7.3" stroke="#18181b" stroke-width="1.1" fill="none" stroke-linecap="round" />
  </g>

  <!-- Category Sub-title -->
  <text x="58" y="38" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="4.8" 
        font-weight="700" 
        letter-spacing="0.12em" 
        fill="#828a96" 
        text-anchor="middle">TOP RATED DESIGN AGENCY</text>

  <!-- Dark Ribbon -->
  <rect x="0" y="46" width="116" height="30" rx="5" fill="url(#ribbonGrad)" filter="url(#ribbonShadow)" />
  
  <!-- Ribbon Script Text -->
  <g transform="translate(58, 67)">
    <text font-family="'Brush Script MT', 'Dancing Script', 'Snell Roundhand', 'Caveat', cursive, sans-serif" 
          font-size="20" 
          font-weight="bold" 
          font-style="italic" 
          fill="#ffffff" 
          text-anchor="middle"
          letter-spacing="0.04em">Dribbble</text>
  </g>

  <!-- SELECT Text -->
  <text x="58" y="99" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8.8" 
        font-weight="800" 
        letter-spacing="0.24em" 
        fill="#111317" 
        text-anchor="middle">SELECT</text>
</svg>
